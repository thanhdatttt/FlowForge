services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowforge
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable not found}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: flowforge-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__FlowForge: Host=db;Port=5432;Database=flowforge;Username=flowforge;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY environment variable not found}
      Database__AutoMigrate: "true"
      PublicApiUrl: ${PUBLIC_API_URL:-http://localhost:8080}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__AppPassword: ${SMTP_APP_PASSWORD:-}
      EmailVerification__LifetimeMinutes: ${EMAIL_VERIFICATION_LIFETIME_MINUTES:-10}
      Invitations__LifetimeDays: ${INVITATION_LIFETIME_DAYS:-7}
      Attachments__StoragePath: /app/private-attachments
      DataProtection__KeyPath: /app/private-email-keys
      Workflows__Enabled: ${WORKFLOWS_ENABLED:-true}
      Workflows__PollSeconds: ${WORKFLOWS_POLL_SECONDS:-5}
      Workflows__DateScanIntervalMinutes: ${WORKFLOWS_DATE_SCAN_INTERVAL_MINUTES:-5}
      Notifications__Enabled: ${NOTIFICATIONS_ENABLED:-true}
      Notifications__PollSeconds: ${NOTIFICATIONS_POLL_SECONDS:-5}
      Notifications__OverdueIntervalMinutes: ${NOTIFICATIONS_OVERDUE_INTERVAL_MINUTES:-5}
      Ai__TimeoutSeconds: ${AI_TIMEOUT_SECONDS:-30}
      Ai__PreviewLifetimeMinutes: ${AI_PREVIEW_LIFETIME_MINUTES:-15}
      Ai__MaxContextItems: ${AI_MAX_CONTEXT_ITEMS:-50}
      Ollama__ApiKey: ${OLLAMA_API_KEY:-}
      Ollama__Model: ${OLLAMA_MODEL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - attachments_data:/app/private-attachments
      - email_keys:/app/private-email-keys

volumes:
  postgres_data:
  attachments_data:
  email_keys:
