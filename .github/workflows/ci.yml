name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: flowforge-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLOWFORGE_TEST_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=flowforge-ci-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FlowForge.sln -m:1
      - name: Build
        run: dotnet build FlowForge.sln --no-restore -m:1 /p:UseSharedCompilation=false
      - name: Test
        run: dotnet test FlowForge.sln --no-restore -m:1 /p:UseSharedCompilation=false
